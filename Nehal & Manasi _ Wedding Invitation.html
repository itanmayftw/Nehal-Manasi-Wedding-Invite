<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nehal & Manasi | Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Hind:wght@300;400;500&family=Tiro+Devanagari+Marathi&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f6efe4;--ivory2:#ece1cf;--wine:#6b1a2a;--wine2:#4a0f1c;--gold:#b8975a;--ink:#3a1a20;--line:rgba(107,26,42,.25);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:'Hind',system-ui,sans-serif;font-weight:300;line-height:1.7}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;margin:0;line-height:1.1}
.mr{font-family:'Tiro Devanagari Marathi','Noto Serif Devanagari',serif;color:var(--wine)}
section{padding:88px 24px;text-align:center}
.wrap{max-width:560px;margin:0 auto}
p{margin:0 0 1em}
.soft{color:#7a5a5f}
.dark{background:var(--wine);color:var(--ivory)}
.dark .soft{color:#d9bfc1}
.dark .gold{color:#e3c78f}
.gold{color:var(--gold)}
.rule{display:block;margin:26px auto;width:120px;height:14px}
h2.t{font-size:clamp(36px,9vw,54px);color:var(--wine);margin-bottom:20px}
.dark h2.t{color:var(--ivory)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* cover: burgundy paper, ivory lace edge, wax seal */
#cover{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;color:var(--ivory);
 background:linear-gradient(115deg,var(--wine) 0 56%,var(--ivory) 56% 100%);transition:transform 1.1s cubic-bezier(.7,0,.2,1)}
#cover.open{transform:translateY(-100%)}
#cover .lace{position:absolute;inset:0;opacity:.5;pointer-events:none;background:radial-gradient(circle at 78% 20%,transparent 0 14px,rgba(184,151,90,.35) 15px 16px,transparent 17px) 0 0/46px 46px,radial-gradient(circle at 78% 20%,transparent 0 6px,rgba(184,151,90,.3) 7px 8px,transparent 9px) 23px 23px/46px 46px;-webkit-mask:linear-gradient(115deg,transparent 56%,#000 62%);mask:linear-gradient(115deg,transparent 56%,#000 62%)}
#cover>*:not(.lace){position:relative}
.seal{width:150px;height:150px;border-radius:50%;border:0;padding:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#8e2a3c,#5a1423 70%);box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 0 0 6px #6b1a2a,inset 0 0 0 7px rgba(227,199,143,.8);display:grid;place-items:center;color:#e3c78f;font-family:'Cormorant Garamond',serif;font-size:46px;transition:transform .3s}
.seal:hover{transform:scale(1.05)}
.seal small{display:block;font-size:12px;letter-spacing:.2em;margin-top:-10px;font-family:'Hind',sans-serif}
#cover .lead{color:var(--ivory);text-shadow:0 1px 8px rgba(0,0,0,.4)}
#cover .tap{color:var(--wine);background:var(--ivory);padding:4px 16px;border-radius:999px;font-size:14px;margin:0}

/* hero */
#hero{min-height:100svh;display:flex;align-items:center;background:radial-gradient(ellipse at top,#fffaf0,var(--ivory) 70%)}
#hero h1{font-size:clamp(56px,16vw,108px);color:var(--wine)}
#hero .amp{display:block;font-style:italic;color:var(--gold);font-size:.5em;margin:.1em 0}
.when{margin-top:34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0}
.when b{display:block;font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:400;color:var(--wine)}

/* countdown */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:30px 0 16px}
.cd div{border-top:1px solid var(--gold);padding-top:12px}
.cd b{display:block;font-family:'Cormorant Garamond',serif;font-size:clamp(36px,10vw,56px);font-weight:400;line-height:1}
.cd span{font-size:13px;color:#d9bfc1}

/* events */
.ev{padding:40px 0;border-bottom:1px solid var(--line)}
.ev:last-of-type{border-bottom:0}
.ev h3{font-size:clamp(34px,8vw,46px);color:var(--wine);margin-bottom:6px}
.ev .time{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold)}
.btn{display:inline-block;margin-top:14px;padding:10px 22px;border:1px solid var(--wine);color:var(--wine);text-decoration:none;border-radius:999px;font-size:14px;min-height:44px;line-height:22px;background:transparent}
.btn:hover{background:var(--wine);color:var(--ivory)}

/* venue */
.map{margin-top:26px;border:1px solid var(--line);width:100%;aspect-ratio:4/3;display:block;background:var(--ivory2)}
.links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.mapcard{position:relative;overflow:hidden;text-decoration:none}.mapcard svg{position:absolute;inset:0;width:100%;height:100%}.mapcard span{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--wine);color:var(--ivory);padding:8px 18px;border-radius:999px;font-size:14px;white-space:nowrap}
#musicBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);background:var(--wine);color:#e3c78f;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#musicBtn.off{opacity:.65}#musicBtn.off::after{content:"";position:absolute;left:13px;right:13px;top:50%;border-top:2px solid #e3c78f;transform:rotate(-45deg)}
/* rsvp */
form{text-align:left;margin-top:26px;display:grid;gap:18px}
label,legend{font-size:14px;color:#d9bfc1;display:block;margin-bottom:6px}
input[type=text],input[type=number],textarea{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(246,239,228,.4);color:var(--ivory);font:inherit;padding:10px 2px;font-size:16px;border-radius:0}
input:focus,textarea:focus{outline:none;border-bottom-color:#e3c78f}
fieldset{border:0;padding:0;margin:0}
.opt{display:flex;align-items:center;gap:10px;padding:8px 0;color:var(--ivory);font-size:16px;margin:0}
.opt input{accent-color:#e3c78f;width:18px;height:18px}
form button{margin-top:6px;background:var(--ivory);color:var(--wine);border:0;font:inherit;font-weight:500;padding:15px;border-radius:999px;cursor:pointer;font-size:16px;min-height:50px}
.err{color:#ffc9bd;font-size:14px;min-height:1.2em;margin:0}
footer{padding:80px 24px 96px;text-align:center;background:var(--ivory2)}
footer h2{font-size:clamp(40px,10vw,64px);color:var(--wine)}
@media (prefers-reduced-motion:reduce){#cover,.seal{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<div id="cover" role="dialog" aria-label="Open invitation">
  <div class="lace"></div>
  <p class="lead" style="margin:0;font-style:italic;font-family:'Cormorant Garamond',serif;font-size:24px">With love, we invite you</p>
  <button class="seal" id="openBtn" type="button" aria-label="Break the seal to open your invitation"><span id="cMono">N&amp;M<small id="cYear">2026</small></span></button>
  <p class="tap">Tap the seal to open</p>
</div>

<button id="musicBtn" class="off" type="button" aria-pressed="false" aria-label="Play or pause music">&#9834;</button>
<main>
  <section id="hero"><div class="wrap">
    <p class="gold" id="kicker"></p>
    <h1 id="names"></h1>
    <p class="soft" style="margin-top:20px" id="tagline"></p>
    <div class="when"><span class="soft">Together with our families</span><b id="heroDate"></b><span class="soft" id="heroTime"></span></div>
  </div></section>

  <section id="welcome" style="background:var(--ivory2)"><div class="wrap">
    <h2 class="t" id="wTitle"></h2>
    <p id="wBody"></p>
    <svg class="rule" viewBox="0 0 120 14" aria-hidden="true"><path d="M2 7h46M72 7h46" stroke="#b8975a" stroke-width="1"/><path d="M60 1l5 6-5 6-5-6z" fill="none" stroke="#b8975a"/></svg>
    <p class="mr" style="font-size:26px;margin-bottom:4px" id="mrNames"></p>
    <p class="soft" id="fullNames"></p>
  </div></section>

  <section id="count" class="dark"><div class="wrap">
    <h2 class="t" id="cTitle"></h2>
    <div class="cd" aria-live="off">
      <div><b id="d">00</b><span>Days</span></div>
      <div><b id="h">00</b><span>Hours</span></div>
      <div><b id="m">00</b><span>Minutes</span></div>
      <div><b id="s">00</b><span>Seconds</span></div>
    </div>
    <p class="soft" id="cNote"></p>
  </div></section>

  <section id="events"><div class="wrap">
    <h2 class="t" id="eTitle"></h2>
    <div id="evList"></div>
  </div></section>

  <section id="venue" style="background:var(--ivory2)"><div class="wrap">
    <h2 class="t">Where we celebrate</h2>
    <h3 style="font-size:30px;color:var(--wine)" id="vName"></h3>
    <p class="soft" id="vCity"></p>
    <a class="map mapcard" id="mapCard" target="_blank" rel="noopener" aria-label="Open the venue in Google Maps"><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="300" fill="#ece1cf"/><g fill="none" stroke="#6b1a2a" stroke-opacity=".14" stroke-width="10" stroke-linecap="round"><path d="M-10 70 C120 90 200 40 410 60"/><path d="M60 -10 C90 120 40 200 80 310"/><path d="M-10 230 C150 200 260 260 410 220"/><path d="M300 -10 C320 100 280 190 330 310"/></g><path d="M-10 150 C90 120 140 190 230 160 S350 120 410 150" fill="none" stroke="#b8975a" stroke-opacity=".55" stroke-width="16" stroke-linecap="round"/><ellipse cx="200" cy="176" rx="22" ry="7" fill="#4a0f1c" fill-opacity=".25"/><path d="M200 170 C178 140 170 126 170 110 a30 30 0 0 1 60 0 C230 126 222 140 200 170z" fill="#6b1a2a"/><circle cx="200" cy="110" r="12" fill="#f6efe4"/></svg><span>Tap to open the map</span></a>
    <div class="links" id="vLinks"></div>
    <p class="soft" style="margin-top:20px" id="vNote"></p>
  </div></section>

  <section id="rsvp" class="dark"><div class="wrap">
    <h2 class="t">RSVP</h2>
    <p class="soft" id="rsvpBy"></p>
    <form id="rsvpForm" novalidate>
      <div><label for="gName">Your name</label><input id="gName" type="text" autocomplete="name"></div>
      <fieldset><legend>Will you be joining us?</legend>
        <label class="opt"><input type="radio" name="att" value="yes" checked> Nakki Yenaaar!</label>
        <label class="opt"><input type="radio" name="att" value="no"> Sorry, Nahi jamnaar.</label>
      </fieldset>
      <div><label for="gCount">Guests (including you)</label><input id="gCount" type="number" min="1" max="10" value="1"></div>
      <fieldset id="evChecks"><legend>Which events will you attend?</legend></fieldset>
      <div><label for="gMsg">A little message (optional)</label><textarea id="gMsg" rows="3"></textarea></div>
      <p class="err" id="err" role="alert"></p>
      <button type="submit">Send confirmation on WhatsApp</button>
    </form>
  </div></section>
</main>

<footer>
  <svg class="rule" viewBox="0 0 120 14" aria-hidden="true"><path d="M2 7h46M72 7h46" stroke="#b8975a" stroke-width="1"/><path d="M60 1l5 6-5 6-5-6z" fill="none" stroke="#b8975a"/></svg>
  <h2 id="fNames"></h2>
  <p class="soft" style="margin-top:16px" id="fLine"></p>
</footer>

<script>
/* ============ EDIT THIS BLOCK ONLY ============ */
const CONFIG = {
  partnerA: "Nehal", partnerB: "Manasi",
  fullA: "Nehal Sawant", fullB: "Manasi Nimase",
  marathiNames: "नेहल आणि मानसी",
  monogram: "N&M", year: "2026",
  kicker: "We're getting married",
  tagline: "Two hearts, two families, one beautiful beginning.",
  heroDate: "12 December 2026", heroTime: "Muhurta at 5:45 PM",
  welcomeTitle: "Join us as we say \u201cI do\u201d",
  welcomeBody: "With the blessings of our parents and elders, we are delighted to invite you to our wedding ceremony, followed by an evening of food, music and reception. Your presence and blessings will make our day truly complete.",
  countdownTitle: "Counting down to our muhurta",
  countdownNote: "Until we tie the knot, 12 December 2026 at 5:45 PM.",
  eventsTitle: "The celebrations",
  closingLine: "Our forever begins with you by our side.",
  muhurta: "2026-12-12T17:45:00+05:30",
  rsvpBy: "30 October 2026",
  rsvpWhatsApp: "918482842862",  /* country code + number, no plus sign */
  venue: {
    name: "Kalpana River Farm (A Unique Agro Tourism)",
    city: "Khutghar, Tal. Shahapur, Maharashtra 421601",
    note: "The ceremony and reception will both be held at the same venue.",
    mapQuery: "Kalpana River Farm, Khutghar, Shahapur, Maharashtra 421601",
    shortLink: "https://maps.app.goo.gl/92XBKewe9G92qk467?g_st=aw"
  },
  events: [
    { title: "Wedding Ceremony", sub: "Muhurta", date: "2026-12-12", time: "17:45", hours: 2, label: "Saturday, 12 December 2026", at: "5:45 PM", note: "Please arrive a little early to take your seats." },
    { title: "Reception", sub: "Dinner and celebrations", date: "2026-12-12", time: "19:30", hours: 3, label: "Saturday, 12 December 2026", at: "7:30 PM onwards", note: "Join us for dinner, music and good company." }
  ]
};
/* =============================================== */

const $ = id => document.getElementById(id), C = CONFIG;
document.title = C.partnerA + " & " + C.partnerB + " | Wedding Invitation";
$("cMono").firstChild.textContent = C.monogram; $("cYear").textContent = C.year;
$("kicker").textContent = C.kicker;
$("names").innerHTML = C.partnerA + '<span class="amp">&amp;</span>' + C.partnerB;
$("tagline").textContent = C.tagline;
$("heroDate").textContent = C.heroDate; $("heroTime").textContent = C.heroTime;
$("wTitle").textContent = C.welcomeTitle; $("wBody").textContent = C.welcomeBody;
$("mrNames").textContent = C.marathiNames;
$("fullNames").textContent = C.fullA + " and " + C.fullB;
$("cTitle").textContent = C.countdownTitle; $("cNote").textContent = C.countdownNote;
$("eTitle").textContent = C.eventsTitle;
$("fNames").textContent = C.partnerA + " & " + C.partnerB; $("fLine").textContent = C.closingLine;
$("rsvpBy").textContent = "Kindly respond by " + C.rsvpBy + ".";

const gcal = e => {
  const s = new Date(e.date + "T" + e.time + ":00+05:30");
  const f = d => d.toISOString().replace(/[-:]|\.\d{3}/g, "");
  const en = new Date(s.getTime() + e.hours * 36e5);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" +
    encodeURIComponent(e.title + " | " + C.partnerA + " & " + C.partnerB) +
    "&dates=" + f(s) + "/" + f(en) + "&location=" + encodeURIComponent(C.venue.mapQuery);
};
C.events.forEach(e => {
  const d = document.createElement("div"); d.className = "ev";
  d.innerHTML = "<h3></h3><p class='soft' style='margin-bottom:4px'></p><p class='time'></p><p class='soft n'></p><a class='btn' target='_blank' rel='noopener'>Add to calendar</a>";
  d.querySelector("h3").textContent = e.title;
  d.querySelector("p").textContent = e.label;
  d.querySelector(".time").textContent = e.at;
  d.querySelector(".n").textContent = e.note;
  d.querySelector("a").href = gcal(e);
  $("evList").appendChild(d);
  const l = document.createElement("label"); l.className = "opt";
  l.innerHTML = "<input type='checkbox' checked> <span></span>";
  l.querySelector("input").value = e.title;
  l.querySelector("span").textContent = e.title + " (" + e.at + ")";
  $("evChecks").appendChild(l);
});

const q = encodeURIComponent(C.venue.mapQuery);
$("vName").textContent = C.venue.name; $("vCity").textContent = C.venue.city; $("vNote").textContent = C.venue.note;
$("mapCard").href = C.venue.shortLink;
$("vLinks").innerHTML =
  "<a class='btn' target='_blank' rel='noopener' href='" + C.venue.shortLink + "'>Open in Google Maps</a>" +
  "<a class='btn' target='_blank' rel='noopener' href='https://maps.apple.com/?q=" + q + "'>Apple Maps</a>";

const target = new Date(C.muhurta).getTime(), pad = n => String(n).padStart(2, "0");
function tick() {
  let t = Math.max(0, target - Date.now());
  const dd = Math.floor(t / 864e5); t -= dd * 864e5;
  const hh = Math.floor(t / 36e5); t -= hh * 36e5;
  const mm = Math.floor(t / 6e4); t -= mm * 6e4;
  $("d").textContent = pad(dd); $("h").textContent = pad(hh); $("m").textContent = pad(mm); $("s").textContent = pad(Math.floor(t / 1000));
}
tick(); setInterval(tick, 1000);

/* Soft romantic instrumental, synthesised in the browser (no audio file needed) */
let ac, master, playing = false;
const prog = [[48,55,59,64,67],[45,52,55,60,64],[41,48,52,57,64],[43,50,55,59,64]];
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(m, t, dur, type, vol, atk) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = hz(m);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.1);
}
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  ac = new AC(); master = ac.createGain(); master.gain.value = 0;
  const len = ac.sampleRate * 3, buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5); }
  const conv = ac.createConvolver(); conv.buffer = buf;
  const wet = ac.createGain(); wet.gain.value = 0.55;
  master.connect(ac.destination); master.connect(conv); conv.connect(wet); wet.connect(ac.destination);
  let next = ac.currentTime + 0.2, bar = 0; const beat = 0.75;
  setInterval(() => {
    while (next < ac.currentTime + 2) {
      const ch = prog[bar % 4];
      ch.forEach((m, i) => tone(m, next, beat * 8, "sine", i < 2 ? 0.05 : 0.025, 1.6));
      [1,2,3,4,3,2,4,3].forEach((ix, k) => tone(ch[ix] + 12, next + k * beat, 2.4, "triangle", 0.07, 0.02));
      next += beat * 8; bar++;
    }
  }, 500);
  return true;
}
function setMusic(on) {
  if (on && !ac && !initAudio()) return;
  playing = on;
  $("musicBtn").setAttribute("aria-pressed", on); $("musicBtn").classList.toggle("off", !on);
  const t = ac.currentTime;
  master.gain.cancelScheduledValues(t);
  if (on) { ac.resume(); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0.5, t + 3); }
  else { master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0, t + 1); setTimeout(() => { if (!playing) ac.suspend(); }, 1200); }
}
$("musicBtn").addEventListener("click", () => { try { setMusic(!playing); } catch (e) {} });

$("openBtn").addEventListener("click", () => {
  try { setMusic(true); } catch (e) {}
  $("cover").classList.add("open");
  setTimeout(() => { $("cover").style.display = "none"; }, 1200);
});

$("rsvpForm").addEventListener("submit", ev => {
  ev.preventDefault();
  const name = $("gName").value.trim();
  if (!name) { $("err").textContent = "Please enter your name."; return; }
  $("err").textContent = "";
  const yes = document.querySelector("input[name=att]:checked").value === "yes";
  const evs = [...document.querySelectorAll("#evChecks input:checked")].map(i => i.value);
  let msg = "Hi! This is " + name + ". " + (yes ? "Nakki yenaar! Total guests: " + $("gCount").value + ". Events: " + evs.join(", ") + "." : "Sorry, nahi jamnaar.");
  const note = $("gMsg").value.trim(); if (note) msg += " " + note;
  window.open("https://wa.me/" + C.rsvpWhatsApp + "?text=" + encodeURIComponent(msg), "_blank", "noopener");
});
</script>
</body>
</html>
